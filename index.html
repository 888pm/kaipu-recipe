<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff2e4d" />
<title>开饭啦菜谱</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root{
    --red:#ff2e4d; --red-soft:#ffe3e8; --orange:#ff7a18;
    --bg:#fff5f0; --card:#fff; --text:#2b2b2b; --sub:#8a8a8a;
    --line:#f0e3dc; --shadow:0 6px 20px rgba(255,46,77,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text);
    max-width:520px; margin:0 auto; min-height:100vh;
    padding-bottom:96px;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--red),var(--orange));
    color:#fff; padding:18px 16px 14px;
    box-shadow:0 4px 14px rgba(255,46,77,.18);
  }
  header h1{font-size:21px; margin:0 0 2px; font-weight:800; letter-spacing:.5px;}
  header p{margin:0; font-size:12px; opacity:.95;}
  .search{
    margin-top:12px; display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.22); border-radius:12px; padding:9px 12px;
  }
  .search input{
    flex:1; border:0; background:transparent; color:#fff; font-size:14px; outline:none;
  }
  .search input::placeholder{color:rgba(255,255,255,.85);}
  .search svg{flex:none;}
  .tabs{display:flex; gap:8px; padding:12px 16px 2px;}
  .tab{
    flex:1; text-align:center; padding:10px; border-radius:12px; background:#fff;
    color:var(--sub); border:1px solid var(--line); font-size:14px; font-weight:700; cursor:pointer;
  }
  .tab.active{background:var(--red); color:#fff; border-color:var(--red);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; padding:7px 14px; border-radius:18px; background:#fff; color:var(--sub);
    font-size:13px; border:1px solid var(--line); white-space:nowrap; cursor:pointer; transition:.15s;
  }
  .chip.active{background:var(--red); color:#fff; border-color:var(--red); font-weight:600;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:10px 16px;}
  .card{
    background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);
    cursor:pointer; transition:transform .12s; border:1px solid var(--line);
  }
  .card:active{transform:scale(.97);}
  .card .img{width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--red-soft); display:block;}
  .card .img.ph{display:flex; align-items:center; justify-content:center; font-size:40px;}
  .card .body{padding:9px 10px 11px;}
  .card .name{font-size:14px; font-weight:700; line-height:1.3; margin:0 0 4px;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;}
  .card .tag{display:inline-block; font-size:11px; color:var(--red); background:var(--red-soft);
    padding:2px 8px; border-radius:10px;}
  .empty{text-align:center; color:var(--sub); padding:60px 24px;}
  .empty .big{font-size:54px; margin-bottom:10px;}
  .todayHead{text-align:center; font-size:15px; font-weight:700; color:var(--text); padding:6px 16px 2px;}
  #todayList{padding:8px 16px 10px;}
  .tcard{display:flex; gap:12px; background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:10px; margin-bottom:12px; box-shadow:var(--shadow); cursor:pointer; align-items:center;}
  .tcard:active{transform:scale(.98);}
  .timg{width:74px; height:74px; border-radius:12px; object-fit:cover; background:var(--red-soft); flex:none;}
  .timg.ph{display:flex; align-items:center; justify-content:center; font-size:30px;}
  .tbody{flex:1; min-width:0;}
  .tname{font-size:15px; font-weight:700; margin-bottom:4px;}
  .tfeel{font-size:13px; color:#555; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .fab{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    width:60px; height:60px; border-radius:50%; background:var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:30px;
    box-shadow:0 8px 22px rgba(255,46,77,.40); cursor:pointer; z-index:30; border:none;
  }
  .fab:active{transform:translateX(-50%) scale(.92);}
  .sheet{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet.show{display:flex;}
  .panel{
    position:relative; background:#fff; width:100%; max-width:520px; border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto;
    animation:up .22s ease;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .panel h2{margin:0 0 16px; font-size:18px; text-align:center;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--sub); margin-bottom:6px;}
  .field input[type=text], .field textarea, .field select{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px;
    font-size:14px; outline:none; background:#fcf8f6; color:var(--text); font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .row{display:flex; gap:10px;}
  .row>*{flex:1;}
  .btn{border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer;}
  .btn.primary{background:var(--red); color:#fff; width:100%;}
  .btn.ghost{background:#f4ece8; color:var(--text); width:100%;}
  .btn.line{background:#fff; color:var(--red); border:1px solid var(--red); width:100%;}
  .btn.dy{background:#161823; color:#fff; width:100%;}
  .imgpick{display:flex; gap:10px; align-items:center;}
  .imgpick .prev{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--red-soft);flex:none;}
  .imgpick label{flex:1; text-align:center; padding:11px; border:1px dashed var(--line); border-radius:12px; font-size:13px; color:var(--sub); cursor:pointer;}
  .detail .hero{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:16px; background:var(--red-soft);}
  .detail .hero.ph{display:flex;align-items:center;justify-content:center;font-size:60px;}
  .detail .dname{font-size:21px; font-weight:800; margin:14px 0 6px;}
  .detail .dtag{display:inline-block;font-size:12px;color:var(--red);background:var(--red-soft);padding:3px 10px;border-radius:12px;margin-bottom:12px;}
  .block{margin:12px 0;}
  .block .bt{font-size:13px; font-weight:700; color:var(--red); margin-bottom:6px;}
  .notes{white-space:pre-wrap; font-size:14px; line-height:1.6; color:#444; background:#fcf8f6; border:1px solid var(--line); border-radius:12px; padding:12px;}
  .detail .acts{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .linkbtn{display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;}
  .hint{font-size:12px; color:var(--sub); line-height:1.6; background:#fff8f3; border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:14px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; padding:14px 16px 0;}
  .topbar .icbtn{background:none;border:none;font-size:13px;color:var(--sub);cursor:pointer;padding:6px;}
  .closeX{position:absolute; top:14px; right:16px; font-size:22px; color:var(--sub); background:none; border:none; cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>🐱 开饭啦菜谱</h1>
  <p>喵～今天想吃什么？点菜式菜单，收藏的小红书/抖音教程一键看</p>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="searchInput" type="text" placeholder="搜菜名 / 食材 / 分类，如 鸡蛋" />
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tabMenu" onclick="setView('menu')">🍲 菜谱</div>
  <div class="tab" id="tabToday" onclick="setView('today')">📅 今日菜谱</div>
</div>

<!-- 菜谱区 -->
<div id="menuArea">
  <div class="topbar">
    <button class="icbtn" onclick="openImport()">⬇️ 批量导入链接</button>
    <button class="icbtn" onclick="openData()">⚙️ 备份/恢复</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- 今日菜谱区 -->
<div id="todayArea" style="display:none">
  <div class="todayHead" id="todayHead"></div>
  <div id="todayList"></div>
</div>

<button class="fab" onclick="openAdd()">＋</button>

<!-- 添加/编辑 面板 -->
<div class="sheet" id="editSheet">
  <div class="panel">
    <button class="closeX" onclick="closeSheet('editSheet')">✕</button>
    <h2 id="editTitle">🐱 添加一道菜</h2>
    <div class="field">
      <label>菜名</label>
      <input type="text" id="f_name" placeholder="例如：番茄炒蛋" />
    </div>
    <div class="row">
      <div class="field">
        <label>分类</label>
        <input type="text" id="f_cat" list="catList" placeholder="午餐" />
        <datalist id="catList"></datalist>
      </div>
      <div class="field">
        <label>难度/标签(可选)</label>
        <input type="text" id="f_tag" placeholder="如：10分钟" />
      </div>
    </div>
    <div class="field">
      <label>🥬 食材</label>
      <textarea id="f_ing" placeholder="一行一个，如：&#10;鸡蛋 2个&#10;番茄 1个&#10;葱 少许"></textarea>
    </div>
    <div class="field">
      <label>🧂 调料</label>
      <textarea id="f_sea" placeholder="一行一个，如：&#10;盐 适量&#10;糖 1勺&#10;生抽 1勺"></textarea>
    </div>
    <div class="field">
      <label>📝 我的备注 / 步骤要点</label>
      <textarea id="f_notes" placeholder="例如：先炒蛋盛出，再炒番茄出汁后倒回蛋，加盐糖"></textarea>
    </div>
    <div class="field">
      <label>菜品图片</label>
      <div class="imgpick">
        <img class="prev" id="f_prev" alt="" />
        <label for="f_img">📷 上传 / 选图</label>
        <input id="f_img" type="file" accept="image/*" style="display:none" />
      </div>
    </div>
    <div class="field">
      <label>📕 小红书教程链接</label>
      <input type="text" id="f_url" placeholder="https://www.xiaohongshu.com/explore/..." />
    </div>
    <div class="field">
      <label>🎵 抖音教程链接</label>
      <input type="text" id="f_url_dy" placeholder="https://v.douyin.com/..." />
    </div>
    <button class="btn primary" onclick="submitForm()">保存</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeSheet('editSheet')">取消</button>
  </div>
</div>

<!-- 详情 面板 -->
<div class="sheet" id="detailSheet">
  <div class="panel detail">
    <button class="closeX" onclick="closeSheet('detailSheet')">✕</button>
    <img class="hero ph" id="d_img" alt="" />
    <div class="dname" id="d_name"></div>
    <span class="dtag" id="d_tag"></span>
    <div id="d_info"></div>
    <div class="acts">
      <button class="btn primary" onclick="addToToday(currentId)">➕ 加到今日菜谱</button>
      <a class="btn line linkbtn" id="d_link_xhs" target="_blank" rel="noopener">▶ 看小红书教程</a>
      <a class="btn dy linkbtn" id="d_link_dy" target="_blank" rel="noopener">▶ 看抖音教程</a>
      <button class="btn line" onclick="editCurrent()">✏️ 编辑</button>
      <button class="btn ghost" onclick="delCurrent()">🗑️ 删除</button>
    </div>
  </div>
</div>

<!-- 今日记录 面板 -->
<div class="sheet" id="entrySheet">
  <div class="panel">
    <button class="closeX" onclick="closeSheet('entrySheet')">✕</button>
    <h2>📝 记录今日做菜</h2>
    <div class="dname" id="e_name" style="margin-top:0"></div>
    <div class="field">
      <label>📷 我做的菜（照片）</label>
      <div class="imgpick">
        <img class="prev" id="e_prev" alt="" />
        <label for="e_img">📷 上传照片</label>
        <input id="e_img" type="file" accept="image/*" style="display:none" />
      </div>
    </div>
    <div class="field">
      <label>💭 感想</label>
      <textarea id="e_feel" placeholder="今天这道菜做得怎么样？味道、心得、翻车现场都行～"></textarea>
    </div>
    <a class="btn primary linkbtn" id="e_link" target="_blank" rel="noopener">▶ 看教程</a>
    <button class="btn line" onclick="saveEntry()">💾 保存</button>
    <button class="btn ghost" style="margin-top:10px" onclick="delEntry()">🗑️ 删除这条</button>
  </div>
</div>

<!-- 批量导入 面板 -->
<div class="sheet" id="importSheet">
  <div class="panel">
    <button class="closeX" onclick="closeSheet('importSheet')">✕</button>
    <h2>⬇️ 批量导入链接</h2>
    <div class="hint">
      在小红书 / 抖音 App 里，对每篇菜谱笔记点「分享 → 复制链接」，把链接一行一个粘到下面
      （系统会自动识别小红书还是抖音）。导入后默认归到「未分类」，可点进去补全菜名、食材和图片。
    </div>
    <textarea id="importBox" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:13px;min-height:120px;outline:none;font-family:inherit;" placeholder="https://www.xiaohongshu.com/explore/abc123
https://v.douyin.com/iRabc/"></textarea>
    <button class="btn primary" style="margin-top:14px" onclick="doImport()">导入</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeSheet('importSheet')">取消</button>
  </div>
</div>

<!-- 备份 面板 -->
<div class="sheet" id="dataSheet">
  <div class="panel">
    <button class="closeX" onclick="closeSheet('dataSheet')">✕</button>
    <h2>⚙️ 备份 / 恢复</h2>
    <div class="hint">数据只存在你这台手机/浏览器里。换手机或清缓存前，先「导出」保存一份；到新设备再「恢复」即可。</div>
    <button class="btn primary" onclick="exportJSON()">⬇️ 导出备份文件</button>
    <button class="btn line" style="margin-top:10px" onclick="document.getElementById('fileInput').click()">⬆️ 从备份恢复</button>
    <input id="fileInput" type="file" accept="application/json" style="display:none" onchange="importJSON(this)" />
    <button class="btn ghost" style="margin-top:10px" onclick="clearAll()">🗑️ 清空全部</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeSheet('dataSheet')">关闭</button>
  </div>
</div>

<script>
const STORE_KEY = 'my_cookbook_v1';
const TODAY_KEY = 'my_cookbook_today_v1';
let dishes = [];
let todayLog = {};
let filterCat = '全部';
let searchTerm = '';
let editId = null;
let currentId = null;
let curEntryId = null;
let view = 'menu';

function load(){ try{ dishes = JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){ dishes=[]; } }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(dishes)); }
function loadToday(){ try{ todayLog = JSON.parse(localStorage.getItem(TODAY_KEY))||{}; }catch(e){ todayLog={}; } }
function saveToday(){ localStorage.setItem(TODAY_KEY, JSON.stringify(todayLog)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function todayKey(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function todayLabel(){ const d=new Date(); const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+w; }

function setView(v){
  view = v;
  document.getElementById('tabMenu').classList.toggle('active', v==='menu');
  document.getElementById('tabToday').classList.toggle('active', v==='today');
  document.getElementById('menuArea').style.display = v==='menu' ? '' : 'none';
  document.getElementById('todayArea').style.display = v==='today' ? '' : 'none';
  if(v==='today') renderToday();
}

/* ---------- 菜谱（菜单） ---------- */
function categories(){
  const s = new Set(['未分类']);
  dishes.forEach(d=> s.add(d.category||'未分类'));
  return ['全部', ...s];
}
function renderChips(){
  const c = categories();
  document.getElementById('chips').innerHTML = c.map(x=>
    `<div class="chip ${x===filterCat?'active':''}" onclick="setCat('${x}')">${x}</div>`
  ).join('');
  document.getElementById('catList').innerHTML = c.filter(x=>x!=='全部').map(x=>`<option value="${x}">`).join('');
}
function setCat(x){ filterCat = x; renderChips(); renderGrid(); }
function renderGrid(){
  const term = searchTerm.trim().toLowerCase();
  let list = dishes.filter(d=>{
    const okCat = filterCat==='全部' || (d.category||'未分类')===filterCat;
    const hay = [d.name,d.category,d.tag,d.ingredients,d.seasonings,d.notes].join(' ').toLowerCase();
    const okTerm = !term || hay.includes(term);
    return okCat && okTerm;
  });
  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/3">
      <div class="big">🐱</div>
      <div>${dishes.length===0?'还没有菜，点右下角 ＋ 添加第一道':'没有匹配的菜'}</div>
    </div>`;
    return;
  }
  list.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
  grid.innerHTML = list.map(d=>`
    <div class="card" onclick="openDetail('${d.id}')">
      ${d.image ? `<img class="img" src="${d.image}" alt="${esc(d.name)}"/>` : `<div class="img ph">🍳</div>`}
      <div class="body">
        <p class="name">${esc(d.name||'未命名')}</p>
        <span class="tag">${(d.category||'未分类')}${d.tag?(' · '+d.tag):''}</span>
      </div>
    </div>`).join('');
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function openSheet(id){ document.getElementById(id).classList.add('show'); }
function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.sheet').forEach(s=>{ s.addEventListener('click', e=>{ if(e.target===s) s.classList.remove('show'); }); });

function openAdd(){
  editId = null;
  document.getElementById('editTitle').textContent = '🐱 添加一道菜';
  document.getElementById('f_name').value='';
  document.getElementById('f_cat').value='';
  document.getElementById('f_tag').value='';
  document.getElementById('f_ing').value='';
  document.getElementById('f_sea').value='';
  document.getElementById('f_notes').value='';
  document.getElementById('f_url').value='';
  document.getElementById('f_url_dy').value='';
  document.getElementById('f_prev').src='';
  document.getElementById('f_prev').style.display='none';
  openSheet('editSheet');
}
let pendingImg = '';
document.getElementById('f_img').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{ pendingImg = ev.target.result; const p=document.getElementById('f_prev'); p.src=pendingImg; p.style.display='block'; };
  r.readAsDataURL(f);
});
function submitForm(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('请填写菜名'); return; }
  const data = {
    name,
    category: document.getElementById('f_cat').value.trim() || '未分类',
    tag: document.getElementById('f_tag').value.trim(),
    ingredients: document.getElementById('f_ing').value.trim(),
    seasonings: document.getElementById('f_sea').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    url: document.getElementById('f_url').value.trim(),
    urlDy: document.getElementById('f_url_dy').value.trim(),
    image: pendingImg
  };
  if(editId){
    const i = dishes.findIndex(d=>d.id===editId);
    if(i>-1) dishes[i] = {...dishes[i], ...data};
  }else{
    data.id = uid(); data.createdAt = Date.now();
    dishes.push(data);
  }
  save(); pendingImg=''; closeSheet('editSheet'); renderChips(); renderGrid();
}
function openDetail(id){
  const d = dishes.find(x=>x.id===id); if(!d) return;
  currentId = id;
  const img = document.getElementById('d_img');
  if(d.image){ img.src=d.image; img.className='hero'; }
  else { img.className='hero ph'; img.textContent='🍳'; img.removeAttribute('src'); }
  document.getElementById('d_name').textContent = d.name||'未命名';
  document.getElementById('d_tag').textContent = (d.category||'未分类') + (d.tag?(' · '+d.tag):'');
  let info='';
  if(d.ingredients) info += block('🥬 食材', d.ingredients);
  if(d.seasonings) info += block('🧂 调料', d.seasonings);
  if(d.notes) info += block('📝 我的备注', d.notes);
  if(!info) info = '<div class="notes">（暂无内容，点编辑补充食材 / 调料 / 步骤）</div>';
  document.getElementById('d_info').innerHTML = info;
  const lx = document.getElementById('d_link_xhs');
  if(d.url){ lx.href=d.url; lx.style.display='flex'; } else lx.style.display='none';
  const ly = document.getElementById('d_link_dy');
  if(d.urlDy){ ly.href=d.urlDy; ly.style.display='flex'; } else ly.style.display='none';
  openSheet('detailSheet');
}
function block(title, text){ return `<div class="block"><div class="bt">${title}</div><div class="notes">${esc(text)}</div></div>`; }
function editCurrent(){
  const d = dishes.find(x=>x.id===currentId); if(!d) return;
  closeSheet('detailSheet');
  editId = currentId;
  document.getElementById('editTitle').textContent = '✏️ 编辑菜品';
  document.getElementById('f_name').value = d.name||'';
  document.getElementById('f_cat').value = d.category||'';
  document.getElementById('f_tag').value = d.tag||'';
  document.getElementById('f_ing').value = d.ingredients||'';
  document.getElementById('f_sea').value = d.seasonings||'';
  document.getElementById('f_notes').value = d.notes||'';
  document.getElementById('f_url').value = d.url||'';
  document.getElementById('f_url_dy').value = d.urlDy||'';
  const p = document.getElementById('f_prev');
  if(d.image){ p.src=d.image; p.style.display='block'; pendingImg=d.image; }
  else { p.style.display='none'; pendingImg=''; }
  openSheet('editSheet');
}
function delCurrent(){
  if(!confirm('确定删除这道菜？')) return;
  dishes = dishes.filter(x=>x.id!==currentId);
  save(); closeSheet('detailSheet'); renderChips(); renderGrid();
}

/* ---------- 今日菜谱 ---------- */
function addToToday(dishId){
  const d = dishes.find(x=>x.id===dishId); if(!d) return;
  const k = todayKey();
  if(!todayLog[k]) todayLog[k] = [];
  const entry = { id:uid(), dishId, name:d.name||'未命名', image:'', feel:'', createdAt:Date.now() };
  todayLog[k].push(entry);
  saveToday();
  closeSheet('detailSheet');
  setView('today');
  openEntryEdit(entry.id);
}
function renderToday(){
  const k = todayKey();
  document.getElementById('todayHead').textContent = '📅 ' + todayLabel() + ' · 今日菜谱';
  const list = todayLog[k] || [];
  const el = document.getElementById('todayList');
  if(list.length===0){
    el.innerHTML = `<div class="empty"><div class="big">🍽️</div>
      <div>今天还没记录～去「🍲 菜谱」里点「➕ 加到今日菜谱」</div></div>`;
    return;
  }
  list.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
  el.innerHTML = list.map(e=>`
    <div class="tcard" onclick="openEntryEdit('${e.id}')">
      ${e.image ? `<img class="timg" src="${e.image}" alt=""/>` : `<div class="timg ph">🍳</div>`}
      <div class="tbody">
        <div class="tname">${esc(e.name)}</div>
        <div class="tfeel">${e.feel ? esc(e.feel) : '<span style="color:var(--sub)">点开记照片 / 感想</span>'}</div>
      </div>
    </div>`).join('');
}
let pendingEntryImg = '';
document.getElementById('e_img').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{ pendingEntryImg = ev.target.result; const p=document.getElementById('e_prev'); p.src=pendingEntryImg; p.style.display='block'; };
  r.readAsDataURL(f);
});
function openEntryEdit(entryId){
  const k = todayKey();
  const arr = todayLog[k] || [];
  const e = arr.find(x=>x.id===entryId); if(!e) return;
  curEntryId = entryId;
  document.getElementById('e_name').textContent = e.name;
  document.getElementById('e_feel').value = e.feel || '';
  const p = document.getElementById('e_prev');
  if(e.image){ p.src=e.image; p.style.display='block'; pendingEntryImg=e.image; }
  else { p.style.display='none'; pendingEntryImg=''; }
  const link = document.getElementById('e_link');
  const dish = dishes.find(x=>x.id===e.dishId);
  if(dish && dish.url){ link.href=dish.url; link.textContent='▶ 看小红书教程'; link.style.display='flex'; }
  else if(dish && dish.urlDy){ link.href=dish.urlDy; link.textContent='▶ 看抖音教程'; link.style.display='flex'; }
  else link.style.display='none';
  openSheet('entrySheet');
}
function saveEntry(){
  const k = todayKey();
  const arr = todayLog[k] || [];
  const i = arr.findIndex(x=>x.id===curEntryId); if(i<0) return;
  arr[i].feel = document.getElementById('e_feel').value.trim();
  arr[i].image = pendingEntryImg;
  saveToday(); closeSheet('entrySheet'); renderToday();
}
function delEntry(){
  if(!confirm('删除这条今日记录？')) return;
  const k = todayKey();
  todayLog[k] = (todayLog[k]||[]).filter(x=>x.id!==curEntryId);
  saveToday(); closeSheet('entrySheet'); renderToday();
}

/* ---------- 批量导入 ---------- */
function openImport(){ document.getElementById('importBox').value=''; openSheet('importSheet'); }
function doImport(){
  const txt = document.getElementById('importBox').value;
  const lines = txt.split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length===0){ alert('请粘贴链接'); return; }
  let n=0;
  lines.forEach((url,i)=>{
    if(!/^https?:\/\//i.test(url)) return;
    const isDy = /douyin\.com|iesdouyin|tiktok/.test(url);
    const m = isDy ? url.match(/douyin\.com\/([a-zA-Z0-9]+)/) : (url.match(/xhs\.com\/explore\/([a-zA-Z0-9]+)/) || url.match(/xiaohongshu\.com\/explore\/([a-zA-Z0-9]+)/));
    const short = m? m[1] : ('链接'+ (dishes.length+i+1));
    const plat = isDy ? '抖音' : '小红书';
    dishes.push({ id:uid(), name:plat+'菜谱 · '+short, category:'未分类', tag:'',
      ingredients:'', seasonings:'', url: isDy?'':url, urlDy: isDy?url:'', notes:'', image:'', createdAt:Date.now() });
    n++;
  });
  save(); closeSheet('importSheet'); renderChips(); renderGrid();
  alert(`成功导入 ${n} 条，去点进去补全菜名、食材和图片吧～`);
}

/* ---------- 备份 ---------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify({dishes, todayLog},null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '开饭啦菜谱备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      const arr = Array.isArray(obj) ? obj : obj.dishes;
      if(!Array.isArray(arr)) throw 0;
      if(confirm('恢复会覆盖当前全部数据，确定？')){
        dishes = arr.map(d=>({
          id:d.id||uid(), name:d.name||'', category:d.category||'未分类', tag:d.tag||'',
          ingredients:d.ingredients||'', seasonings:d.seasonings||'', url:d.url||'',
          urlDy:d.urlDy||'', notes:d.notes||'', image:d.image||'', createdAt:d.createdAt||Date.now()
        }));
        if(obj && obj.todayLog) todayLog = obj.todayLog;
        save(); saveToday(); renderChips(); renderGrid(); renderToday(); closeSheet('dataSheet'); alert('恢复成功');
      }
    }catch(err){ alert('文件格式不对'); }
  };
  r.readAsText(f);
}
function clearAll(){
  if(confirm('确定清空全部菜品和今日记录？建议先导出备份。')){
    dishes=[]; todayLog={}; save(); saveToday(); closeSheet('dataSheet'); renderChips(); renderGrid(); renderToday();
  }
}

/* ---------- 搜索 ---------- */
document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm = e.target.value; renderGrid(); });

/* 初始化 */
load(); loadToday(); renderChips(); renderGrid(); setView('menu');

  ];
  save(); localStorage.setItem('seeded','1'); renderChips(); renderGrid();
}
